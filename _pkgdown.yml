# pkgdown config styled after DiseaseNeurogenomics/dreamlet:
# Bootstrap 5 + Flatly, README-driven homepage, katex, organized articles.
# The site builds to the default docs/ directory, committed so GitHub Pages
# can serve it (https://mdmanurung.github.io/cellprograms).
url: https://mdmanurung.github.io/cellprograms

authors:
  "Mikhael Dito Manurung":
    href: https://github.com/mdmanurung

template:
  bootstrap: 5
  bootswatch: flatly
  math-rendering: katex

search:
  exclude: ['news/index.html']

reference:
- title: Metacells (SEACells + mcRigor)
  desc: >
    Optional upstream aggregation of single cells into metacells before
    program discovery. Requires the suggested packages Seurat, mcRigor and
    basilisk (the SEACells Python environment is built on first use).
  contents:
  - MetacellsByGroupsSEACells
  - OptimizeGammaSEACells
  - GetMetacellSEACells
- title: All functions
  contents:
  - matches(".")

articles:
- title: Getting started
  navbar: ~
  contents:
  - quickstart
  - articles/metacells_seacells

- title: Methods
  navbar: ~
  contents:
  - articles/model_mechanisms
  - articles/cebmf_backend

- title: Case studies
  navbar: ~
  contents:
  - articles/real_data_case_study
  - articles/divas_case_study
  - articles/cross_cohort_replication

- title: Applications
  navbar: ~
  contents:
  - articles/immune_aging_cross_cohort

- title: Comparisons
  navbar: ~
  contents:
  - articles/mofacellular_comparison
