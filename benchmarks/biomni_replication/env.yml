# NOT the canonical environment file -- use env_fix.yml.
#
# r-flashier and r-ebnm are not on conda-forge, so the original single-step env spec
# (r-flashier, r-ebnm, r-arrow, scanpy, ... ) could not be solved. The working env
# `cellprograms-r` was built in two steps instead:
#   1. `micromamba create -f env_fix.yml` (R 4.4 + ashr, PMA, testthat, pkgload,
#      data.table, Matrix, cli, rlang, class, remotes, edgeR, compilers) -- see env_fix.sbatch;
#   2. `install.packages(c("ebnm", "flashier"))` from CRAN into that env's own R
#      library (env_fix.sbatch ran it as the user; env_fix2.sbatch re-ran it with
#      lib=.Library so the packages land in the env itself, used with R_LIBS_USER=/nonexistent).
# The env now lives at /exports/archive/hg-funcgenom-research/mdmanurung/conda/envs/cellprograms-r.
# The python side (scanpy, pyarrow, cellxgene-census; 01_pseudobulk.py) is a separate env, cellprograms-py.
