# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }}, ${{ matrix.config.lane }})
    strategy:
      fail-fast: false
      matrix:
        config:
          # pinned-compatible lane: exact dependency commits from Remotes
          - {os: ubuntu-latest, r: 'release', lane: 'pinned'}
          - {os: macos-latest, r: 'release', lane: 'pinned'}
          # upstream-main lane: flashier-utils main, to catch upstream drift early
          - {os: ubuntu-latest, r: 'release', lane: 'upstream-main'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      # Installs Imports/Suggests and rcmdcheck; packages are cached across runs.
      # Remotes pins flashier (willwerscheid/flashier@fd44811) and, for the
      # pinned lane, flashier-utils (mdmanurung/flashier-utils@sync/stage-a).
      # any::remotes is needed by the upstream-main lane install step below.
      # mashr's RcppGSL binary from the RSPM is built against libgsl.so.27
      # (Posit's build environment) while ubuntu-24.04 ships libgsl.so.28 -
      # dyn.load fails on soname mismatch. Install system GSL so mashr (and
      # the mashr-gated tests) work on the Linux legs, matching pkgdown.yaml.
      - name: Install GSL for mashr
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgsl-dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::remotes
          needs: check

      # upstream-main lane: replace the pinned flashier-utils with its main branch
      - name: Install flashier-utils main (upstream-main lane)
        if: matrix.config.lane == 'upstream-main'
        shell: Rscript {0}
        run: remotes::install_github("mdmanurung/flashier-utils@main", upgrade = "never")

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: "no"
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          args: 'c("--no-manual","--as-cran")'
          error-on: '"error"'

      - name: Run testthat
        shell: Rscript {0}
        run: |
          cat("Running testthat::test_local()\n")
          testthat::test_local(".")
