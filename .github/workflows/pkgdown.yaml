# pkgdown site build + GitHub Pages deployment (artifact model).
# Mirrors mdmanurung/flashier-utils' pkgdown.yaml so both sites build the
# same way. One-time setup: Settings -> Pages -> Source -> "GitHub Actions".
# Until that switch, the committed docs/ directory keeps serving the site;
# after the first successful deploy, docs/ can be untracked (see reports).
name: pkgdown
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install GSL for mashr
        run: sudo apt-get update && sudo apt-get install -y libgsl-dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: any::pkgdown, local::.
          needs: website
      - name: Build documentation
        shell: Rscript {0}
        run: |
          # Articles are CI-safe: case-study chunks are eval = FALSE display
          # code, and mofacellular_comparison() loads its committed cache
          # (vignettes/articles/mofacellular_stephenson_cache.rds).
          pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
      - name: Restore static audit docs into the built site
        # reports/cebmf-extension/ is source-controlled narrative (repository
        # audit, statistical/computational design, experiment plan) served at
        # the same URL as before. pkgdown >= 2.2 clears the output directory
        # at build start (unmanaged files are NOT preserved), so the narrative
        # is copied in AFTER the build rather than stored under docs/.
        run: |
          cp -r reports/cebmf-extension docs/cebmf-extension
          test -d docs/cebmf-extension || {
            echo "::error::docs/cebmf-extension missing from built site"
            exit 1
          }
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish documentation
        id: deployment
        uses: actions/deploy-pages@v5
