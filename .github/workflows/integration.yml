# Scheduled opt-in integration suite (CPMC_INTEGRATION=1): catches backend
# drift in the SEACells basilisk env (floating transitive pip deps), mcRigor
# GitHub HEAD, and the floating R stack (Seurat/Matrix) before it bites users.
# PRs stay fast: this does NOT run on push/PR — see R-CMD-check.yaml.
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      issue_on_failure:
        description: "Open/update an issue on failure"
        type: boolean
        default: true

name: integration-suite

permissions:
  contents: read
  issues: write

concurrency:
  group: integration-suite
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Explicit basilisk root: same knob the dev machines use; keeps the
      # env out of $HOME and makes a future cached lane trivial to add.
      BASILISK_EXTERNAL_DIR: /opt/basilisk
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # Installs Imports + Suggests (basilisk, Seurat, mcRigor via Remotes)
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::remotes

      # Preflight: fail fast with readable errors before the suite runs.
      # 1. mashr installs from the RSPM binary but can fail to LOAD on
      #    fresh R releases (observed on R 4.6.1, run #2); print the real
      #    load error and fall back to a source build.
      # 2. Build the cebmf basilisk env up front (the suite would build it
      #    lazily anyway; here a spec break surfaces as a clear preflight
      #    failure instead of a confusing mid-suite error).
      - name: Preflight R/python environment
        run: |
          Rscript -e '
            ok <- requireNamespace("mashr", quietly = TRUE)
            if (!ok) {
              err <- tryCatch({ library(mashr); NULL },
                              error = function(e) conditionMessage(e))
              message("mashr binary load failed: ", err)
              message("retrying mashr from source ...")
              install.packages("mashr", repos = "https://cran.r-project.org",
                               type = "source")
              stopifnot(requireNamespace("mashr", quietly = TRUE))
            }
            pkgload::load_all(".", quiet = TRUE)
            env <- cellprograms:::.cebmf_basilisk_env()
            proc <- cellprograms:::.cebmf_basilisk_start(env)
            basilisk::basiliskStop(proc)
            cat("preflight OK: mashr loads, cebmf basilisk env built\n")
          '

      # The suite runs with NO cellprograms.cebmf_python_env option: the
      # cebmf backend takes its default basilisk path - the same path users
      # hit. (A dedicated venv lane existed until run #2; it never installed
      # numpy/scipy and duplicated the pins the basilisk spec already owns.)
      - name: Run integration suite
        shell: bash
        env:
          CPMC_INTEGRATION: "1"
        run: |
          set -o pipefail
          Rscript -e 'testthat::test_local(".", reporter = "summary", stop_on_failure = TRUE)' 2>&1 | tee integration_suite.log

      - name: Upload suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-suite-log
          path: integration_suite.log
          if-no-files-found: ignore

      - name: Open or update drift issue
        if: failure() && (github.event_name == 'schedule' || inputs.issue_on_failure)
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Integration suite failing (backend drift?)";
            const body = `Scheduled CPMC_INTEGRATION=1 run failed at ${process.env.GITHUB_SHA}.
            Likely causes: floating transitive pip deps in the SEACells env, mcRigor HEAD changes, or Seurat/Matrix updates.
            Run: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", per_page: 100
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body: `Still failing: ${body}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["backend-drift"]
              });
            }

      - name: Close drift issue on success
        if: success() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Integration suite failing (backend drift?)";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", per_page: 100
            });
            for (const issue of issues.filter(i => i.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `Back to green at ${process.env.GITHUB_SHA} — closing.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: "closed"
              });
            }
