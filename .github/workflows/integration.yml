# Scheduled opt-in integration suite (CPMC_INTEGRATION=1): catches backend
# drift in the SEACells basilisk env (floating transitive pip deps), mcRigor
# GitHub HEAD, and the floating R stack (Seurat/Matrix) before it bites users.
# PRs stay fast: this does NOT run on push/PR — see R-CMD-check.yaml.
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      issue_on_failure:
        description: "Open/update an issue on failure"
        type: boolean
        default: true

name: integration-suite

permissions:
  contents: read
  issues: write

concurrency:
  group: integration-suite
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Explicit basilisk root: same knob the dev machines use; keeps the
      # env out of $HOME and makes a future cached lane trivial to add.
      BASILISK_EXTERNAL_DIR: /opt/basilisk
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # Installs Imports + Suggests (basilisk, Seurat, mcRigor via Remotes)
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::remotes

      # cebmf_torch backend venv (pins mirror the audit ledger)
      - name: Build cebmf python env
        run: |
          python3 -m venv /opt/cebmf-venv
          /opt/cebmf-venv/bin/pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          /opt/cebmf-venv/bin/pip install "cebmf_torch @ git+https://github.com/william-denault/cebmf_torch.git@34abac5a7d05b6fc5c6f8052c5fc4fd96628597d"

      - name: Run integration suite
        shell: bash
        env:
          CPMC_INTEGRATION: "1"
        run: |
          set -o pipefail
          Rscript -e 'options(cellprograms.cebmf_python_env = "/opt/cebmf-venv"); testthat::test_local(".", reporter = "summary", stop_on_failure = TRUE)' 2>&1 | tee integration_suite.log

      - name: Upload suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-suite-log
          path: integration_suite.log
          if-no-files-found: ignore

      - name: Open or update drift issue
        if: failure() && (github.event_name == 'schedule' || inputs.issue_on_failure)
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Integration suite failing (backend drift?)";
            const body = `Scheduled CPMC_INTEGRATION=1 run failed at ${process.env.GITHUB_SHA}.
            Likely causes: floating transitive pip deps in the SEACells env, mcRigor HEAD changes, or Seurat/Matrix updates.
            Run: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", per_page: 100
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body: `Still failing: ${body}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["backend-drift"]
              });
            }

      - name: Close drift issue on success
        if: success() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Integration suite failing (backend drift?)";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", per_page: 100
            });
            for (const issue of issues.filter(i => i.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `Back to green at ${process.env.GITHUB_SHA} — closing.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: "closed"
              });
            }
